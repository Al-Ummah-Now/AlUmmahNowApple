included: [Apps, Packages, UITests]
excluded: ["**/.build", "**/__Snapshots__", "**/Package.swift", "**/Generated"]
disabled_rules: [closure_parameter_position, trailing_comma, opening_brace, identifier_name, todo, large_tuple, nesting, static_over_final_class, multiple_closures_with_trailing_closure]
opt_in_rules: [empty_count, first_where]
custom_rules:
  no_todo_comments:
    name: "No TODO comments"
    regex: "(//|/\\*).*\\b(TODO|FIXME|HACK)\\b"
    message: "Implement it now or open a GitHub issue labelled queue."
    severity: error
  no_print:
    name: "Use os.Logger"
    regex: "^\\s*(print|NSLog|debugPrint)\\("
    message: "Use os.Logger via AUNLog."
    severity: error
  admin_media_never_stored:
    name: "Admin media is never cached, downloaded or shared"
    included: ["Packages/AUNAdmin/Sources/.*\\.swift", "Apps/Admin.*/.*\\.swift", "Packages/AUNCoreBridge/Sources/AUNCoreBridge/Admin/.*\\.swift"]
    regex: "\\b(AsyncImage|URLSession\\.shared|URLCache\\.shared|AVAssetDownload\\w*|ShareLink|fileExporter|onDrag|draggable|UIImageWriteToSavedPhotosAlbum|PHPhotoLibrary|UIPasteboard|NSPasteboard|UNNotificationAttachment)\\b"
    message: "Owner rule: the Admin app never caches, downloads or shares media. Use PrivateMediaSession and PrivateImage."
    severity: error
line_length: {warning: 180, error: 200}
file_length: {warning: 600, error: 900}
type_body_length: {warning: 400, error: 600}
function_body_length: {warning: 80, error: 140}
cyclomatic_complexity: {ignores_case_statements: true}
