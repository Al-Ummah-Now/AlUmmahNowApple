# Source of truth for AlUmmahNow.xcodeproj. Run `make generate` after changing it.
name: AlUmmahNow
options:
  bundleIdPrefix: net.alummahnow
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
configs:
  Debug: debug
  QA: release
  Release: release
configFiles:
  Debug: Configs/QA.xcconfig
  QA: Configs/QA.xcconfig
  Release: Configs/Prod.xcconfig
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    INFOPLIST_KEY_CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
packages:
  AUNCoreBridge: {path: Packages/AUNCoreBridge}
  AUNDesign: {path: Packages/AUNDesign}
  AUNPlayer: {path: Packages/AUNPlayer}
  AUNFeatures: {path: Packages/AUNFeatures}
  AUNStudio: {path: Packages/AUNStudio}
  AUNCoreKit: {path: Packages/AUNCoreKit}
  AUNAdmin: {path: Packages/AUNAdmin}

targetTemplates:
  App:
    type: application
    sources:
      - path: Apps/${target_name}
    info:
      path: Apps/${target_name}/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        AUNAuthIssuer: "$(AUN_AUTH_ISSUER)"
        AUNOAuthClientID: "$(AUN_OAUTH_CLIENT_ID)"
        UILaunchScreen: {}

targets:
  ViewerIOS:
    templates: [App]
    platform: iOS
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.viewer$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Al Ummah Now
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Apps/ViewerIOS/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - package: AUNFeatures
      - package: AUNDesign
      - package: AUNCoreBridge
    scheme:
      testTargets:
        - ViewerIOSUITests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNDesign/AUNDesignTests
        - package: AUNPlayer/AUNPlayerTests
        - package: AUNFeatures/AUNFeaturesTests
        - package: AUNStudio/AUNStudioTests

  ViewerTV:
    templates: [App]
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.viewer.tv$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Al Ummah Now
        TARGETED_DEVICE_FAMILY: "3"
    dependencies:
      - package: AUNFeatures
      - package: AUNDesign
      - package: AUNCoreBridge
    scheme:
      testTargets:
        - ViewerTVUITests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNDesign/AUNDesignTests
        - package: AUNPlayer/AUNPlayerTests

  ViewerMac:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.viewer.mac$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Al Ummah Now
    entitlements:
      path: Apps/ViewerMac/ViewerMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    dependencies:
      - package: AUNFeatures
      - package: AUNDesign
      - package: AUNCoreBridge
    scheme:
      testTargets:
        - ViewerMacUITests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNDesign/AUNDesignTests
        - package: AUNPlayer/AUNPlayerTests
        - package: AUNStudio/AUNStudioTests
        - package: AUNFeatures/AUNFeaturesTests

  StudioIOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.studio$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Al Ummah Now Studio
        AUN_OAUTH_CLIENT_ID: $(AUN_STUDIO_CLIENT_ID_IOS)
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: AUNStudio
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
    scheme:
      testTargets:
        - StudioIOSUITests
        - package: AUNStudio/AUNStudioTests
        - package: AUNCoreKit/AUNCoreKitTests

  StudioMac:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.studio.mac$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Al Ummah Now Studio
        AUN_OAUTH_CLIENT_ID: $(AUN_STUDIO_CLIENT_ID_MAC)
    entitlements:
      path: Apps/StudioMac/StudioMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    dependencies:
      - package: AUNStudio
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
    scheme:
      testTargets:
        - StudioMacUITests
        - package: AUNCoreKit/AUNCoreKitTests

  # Al Ummah Now Admin (wiki AUN-ADMIN-NATIVE): staff only, TestFlight internal only, never a public download.
  # Debug builds (simulator, CI, ad hoc Mac UI tests) carry no push entitlements; QA and Release add APNs and Time
  # Sensitive, which need the owner's provisioning (docs/RELEASING.md, Admin).
  AdminIOS:
    templates: [App]
    platform: iOS
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.admin$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Al Ummah Now Admin
        AUN_OAUTH_CLIENT_ID: $(AUN_ADMIN_CLIENT_ID_IOS)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/AdminIOS/AdminIOS.entitlements
      configs:
        Debug: {CODE_SIGN_ENTITLEMENTS: Apps/AdminIOS/AdminIOS.debug.entitlements}
    info:
      path: Apps/AdminIOS/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        AUNAuthIssuer: "$(AUN_AUTH_ISSUER)"
        AUNOAuthClientID: "$(AUN_OAUTH_CLIENT_ID)"
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSFaceIDUsageDescription: "Unlock Al Ummah Now Admin with Face ID."
        CFBundleURLTypes:
          - CFBundleURLName: net.alummahnow.admin
            CFBundleURLSchemes: [alummahnow-admin]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNAdmin
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
      - package: AUNStudio
    scheme:
      testTargets:
        - AdminIOSUITests
        - package: AUNAdmin/AUNAdminTests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNCoreKit/AUNCoreKitTests

  AdminMac:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.admin.mac$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Al Ummah Now Admin
        AUN_OAUTH_CLIENT_ID: $(AUN_ADMIN_CLIENT_ID_MAC)
        CODE_SIGN_ENTITLEMENTS: Apps/AdminMac/AdminMac.entitlements
      configs:
        Debug: {CODE_SIGN_ENTITLEMENTS: Apps/AdminMac/AdminMac.debug.entitlements}
    info:
      path: Apps/AdminMac/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        AUNAuthIssuer: "$(AUN_AUTH_ISSUER)"
        AUNOAuthClientID: "$(AUN_OAUTH_CLIENT_ID)"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: net.alummahnow.admin.mac
            CFBundleURLSchemes: [alummahnow-admin]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNAdmin
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
      - package: AUNStudio
    scheme:
      testTargets:
        - AdminMacUITests
        - package: AUNAdmin/AUNAdminTests

  ViewerIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/ViewerIOS]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: ViewerIOS, TARGETED_DEVICE_FAMILY: "1,2"}}
    dependencies: [{target: ViewerIOS}]
  ViewerTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests/ViewerTV]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: ViewerTV, TARGETED_DEVICE_FAMILY: "3"}}
    dependencies: [{target: ViewerTV}]
  ViewerMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/ViewerMac]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: ViewerMac}}
    dependencies: [{target: ViewerMac}]
  StudioIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/StudioIOS]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: StudioIOS, TARGETED_DEVICE_FAMILY: "1,2"}}
    dependencies: [{target: StudioIOS}]
  StudioMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/StudioMac]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: StudioMac}}
    dependencies: [{target: StudioMac}]
  AdminIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/AdminIOS]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: AdminIOS, TARGETED_DEVICE_FAMILY: "1,2"}}
    dependencies: [{target: AdminIOS}]
  AdminMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/AdminMac]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: AdminMac}}
    dependencies: [{target: AdminMac}]
