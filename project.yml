# Source of truth for AlUmmahNow.xcodeproj. Run `make generate` after changing it.
name: AlUmmahNow
options:
  bundleIdPrefix: net.alummahnow
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
configs:
  Debug: debug
  QA: release
  Release: release
configFiles:
  Debug: Configs/QA.xcconfig
  QA: Configs/QA.xcconfig
  Release: Configs/Prod.xcconfig
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    INFOPLIST_KEY_CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Apps/*/Assets.xcassets: crops of the owner's art (scripts/make-app-icons.swift).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  AUNCoreBridge: {path: Packages/AUNCoreBridge}
  AUNDesign: {path: Packages/AUNDesign}
  AUNPlayer: {path: Packages/AUNPlayer}
  AUNFeatures: {path: Packages/AUNFeatures}
  AUNStudio: {path: Packages/AUNStudio}
  AUNCoreKit: {path: Packages/AUNCoreKit}
  AUNAdmin: {path: Packages/AUNAdmin}
  AUNViewerClip: {path: Packages/AUNViewerClip}

targetTemplates:
  App:
    type: application
    sources:
      - path: Apps/${target_name}
    info:
      path: Apps/${target_name}/Info.plist
      properties:
        # Home-screen / Dock name (owner, 2026-11-20): "Ummah Now", "Studio", "Admin"; the store listings keep the
        # full names (store/apple). The Arabic name (AUN_APP_NAME_AR) is written to ar.lproj by the script below.
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        AUNAuthIssuer: "$(AUN_AUTH_ISSUER)"
        AUNOAuthClientID: "$(AUN_OAUTH_CLIENT_ID)"
        UILaunchScreen: {}
        # The release scripts set these from the tag (scripts/release-version.sh); without them every build is 1.0 (1).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    postBuildScripts:
      # InfoPlist.strings can't expand build settings, so the Arabic name with the QA suffix is written at build time.
      - name: Arabic display name
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ar.lproj/InfoPlist.strings
        script: |
          dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ar.lproj"
          mkdir -p "$dir"
          printf '"CFBundleDisplayName" = "%s%s";\n' "$AUN_APP_NAME_AR" "$AUN_DISPLAY_SUFFIX" > "$dir/InfoPlist.strings"

targets:
  ViewerIOS:
    templates: [App]
    platform: iOS
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.viewer$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Ummah Now
        AUN_APP_NAME_AR: الأمة الآن
        TARGETED_DEVICE_FAMILY: "1,2"
        # Universal links only in the signed QA and Release builds; Debug (CI, simulator) carries no entitlements.
        CODE_SIGN_ENTITLEMENTS: Apps/ViewerIOS/ViewerIOS.entitlements
      configs:
        Debug: {CODE_SIGN_ENTITLEMENTS: ""}
    info:
      path: Apps/ViewerIOS/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - package: AUNFeatures
      - package: AUNDesign
      - package: AUNCoreBridge
    scheme:
      testTargets:
        - ViewerIOSUITests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNDesign/AUNDesignTests
        - package: AUNPlayer/AUNPlayerTests
        - package: AUNFeatures/AUNFeaturesTests
        - package: AUNStudio/AUNStudioTests
        - package: AUNViewerClip/AUNViewerClipTests

  ViewerClip:
    templates: [App]
    type: application.on-demand-install-capable
    platform: iOS
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.viewer.clip$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Ummah Now
        AUN_APP_NAME_AR: الأمة الآن
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/ViewerClip/ViewerClip.entitlements
      configs:
        Debug: {CODE_SIGN_ENTITLEMENTS: ""}
    info:
      path: Apps/ViewerClip/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - package: AUNViewerClip
      - package: AUNDesign
      - package: AUNCoreBridge

  ViewerTV:
    templates: [App]
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.viewer.tv$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Ummah Now
        AUN_APP_NAME_AR: الأمة الآن
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
    info:
      path: Apps/ViewerTV/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNFeatures
      - package: AUNDesign
      - package: AUNCoreBridge
    scheme:
      testTargets:
        - ViewerTVUITests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNDesign/AUNDesignTests
        - package: AUNPlayer/AUNPlayerTests

  ViewerMac:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.viewer.mac$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Ummah Now
        AUN_APP_NAME_AR: الأمة الآن
        # Sandbox everywhere; universal links only in the signed QA and Release builds (ad hoc Debug cannot carry them).
        # `.debug` (sandbox only) for Debug; scripts/release.sh also picks it for ad hoc and certificate-only builds.
        CODE_SIGN_ENTITLEMENTS: Apps/ViewerMac/ViewerMac$(AUN_ENTITLEMENTS_VARIANT).entitlements
      configs:
        Debug: {AUN_ENTITLEMENTS_VARIANT: .debug}
    info:
      path: Apps/ViewerMac/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.video
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNFeatures
      - package: AUNDesign
      - package: AUNCoreBridge
    scheme:
      testTargets:
        - ViewerMacUITests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNDesign/AUNDesignTests
        - package: AUNPlayer/AUNPlayerTests
        - package: AUNStudio/AUNStudioTests
        - package: AUNFeatures/AUNFeaturesTests

  StudioIOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.studio$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Studio
        AUN_APP_NAME_AR: الاستوديو
        AUN_OAUTH_CLIENT_ID: $(AUN_STUDIO_CLIENT_ID_IOS)
        TARGETED_DEVICE_FAMILY: "1,2"
        # Universal links and App Attest only in the signed QA and Release builds; Debug carries no entitlements.
        CODE_SIGN_ENTITLEMENTS: Apps/StudioIOS/StudioIOS.entitlements
      configs:
        Debug: {CODE_SIGN_ENTITLEMENTS: ""}
    info:
      path: Apps/StudioIOS/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNStudio
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
    scheme:
      testTargets:
        - StudioIOSUITests
        - package: AUNStudio/AUNStudioTests
        - package: AUNCoreKit/AUNCoreKitTests

  StudioMac:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.studio.mac$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Studio
        AUN_APP_NAME_AR: الاستوديو
        AUN_OAUTH_CLIENT_ID: $(AUN_STUDIO_CLIENT_ID_MAC)
        # Universal links only in the signed QA and Release builds (ad hoc Debug and unsigned releases cannot carry them).
        # `.debug` (sandbox only) for Debug; scripts/release.sh also picks it for ad hoc and certificate-only builds.
        CODE_SIGN_ENTITLEMENTS: Apps/StudioMac/StudioMac$(AUN_ENTITLEMENTS_VARIANT).entitlements
      configs:
        Debug: {AUN_ENTITLEMENTS_VARIANT: .debug}
    info:
      path: Apps/StudioMac/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.video
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNStudio
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
    scheme:
      testTargets:
        - StudioMacUITests
        - package: AUNCoreKit/AUNCoreKitTests

  # Al Ummah Now Admin (wiki AUN-ADMIN-NATIVE): staff only, TestFlight internal only, never a public download.
  # Debug builds (simulator, CI, ad hoc Mac UI tests) carry no push entitlements; QA and Release add APNs and Time
  # Sensitive, which need the owner's provisioning (docs/RELEASING.md, Admin).
  AdminIOS:
    templates: [App]
    platform: iOS
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.admin$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Admin
        AUN_APP_NAME_AR: الإدارة
        AUN_OAUTH_CLIENT_ID: $(AUN_ADMIN_CLIENT_ID_IOS)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/AdminIOS/AdminIOS.entitlements
      configs:
        Debug: {CODE_SIGN_ENTITLEMENTS: Apps/AdminIOS/AdminIOS.debug.entitlements}
    info:
      path: Apps/AdminIOS/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        AUNAuthIssuer: "$(AUN_AUTH_ISSUER)"
        AUNOAuthClientID: "$(AUN_OAUTH_CLIENT_ID)"
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSFaceIDUsageDescription: "Unlock Al Ummah Now Admin with Face ID."
        CFBundleURLTypes:
          - CFBundleURLName: net.alummahnow.admin
            CFBundleURLSchemes: [alummahnow-admin]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNAdmin
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
      - package: AUNStudio
    scheme:
      testTargets:
        - AdminIOSUITests
        - package: AUNAdmin/AUNAdminTests
        - package: AUNCoreBridge/AUNCoreBridgeTests
        - package: AUNCoreKit/AUNCoreKitTests

  AdminMac:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.alummahnow.admin.mac$(AUN_BUNDLE_SUFFIX)
        AUN_APP_NAME: Admin
        AUN_APP_NAME_AR: الإدارة
        AUN_OAUTH_CLIENT_ID: $(AUN_ADMIN_CLIENT_ID_MAC)
        CODE_SIGN_ENTITLEMENTS: Apps/AdminMac/AdminMac.entitlements
      configs:
        Debug: {CODE_SIGN_ENTITLEMENTS: Apps/AdminMac/AdminMac.debug.entitlements}
    info:
      path: Apps/AdminMac/Info.plist
      properties:
        CFBundleDisplayName: "$(AUN_APP_NAME)$(AUN_DISPLAY_SUFFIX)"
        CFBundleLocalizations: [en, ar]
        AUNAPIBaseURL: "$(AUN_API_BASE_URL)"
        AUNAdminAPIBaseURL: "$(AUN_ADMIN_API_BASE_URL)"
        AUNEnvironment: "$(AUN_ENVIRONMENT)"
        AUNAuthIssuer: "$(AUN_AUTH_ISSUER)"
        AUNOAuthClientID: "$(AUN_OAUTH_CLIENT_ID)"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: net.alummahnow.admin.mac
            CFBundleURLSchemes: [alummahnow-admin]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: AUNAdmin
      - package: AUNDesign
      - package: AUNCoreBridge
      - package: AUNCoreKit
      - package: AUNStudio
    scheme:
      testTargets:
        - AdminMacUITests
        - package: AUNAdmin/AUNAdminTests

  ViewerIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/ViewerIOS, UITests/Shared]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: ViewerIOS, TARGETED_DEVICE_FAMILY: "1,2"}}
    dependencies: [{target: ViewerIOS}]
  ViewerTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests/ViewerTV, UITests/Shared]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: ViewerTV, TARGETED_DEVICE_FAMILY: "3"}}
    dependencies: [{target: ViewerTV}]
  ViewerMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/ViewerMac, UITests/Shared]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: ViewerMac}}
    dependencies: [{target: ViewerMac}]
  StudioIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/StudioIOS, UITests/Shared]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: StudioIOS, TARGETED_DEVICE_FAMILY: "1,2"}}
    dependencies: [{target: StudioIOS}]
  StudioMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/StudioMac, UITests/Shared]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: StudioMac}}
    dependencies: [{target: StudioMac}]
  AdminIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/AdminIOS]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: AdminIOS, TARGETED_DEVICE_FAMILY: "1,2"}}
    dependencies: [{target: AdminIOS}]
  AdminMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/AdminMac]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: AdminMac}}
    dependencies: [{target: AdminMac}]
