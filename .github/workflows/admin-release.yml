name: Admin release
# A tag admin-vX.Y.Z on main builds Al Ummah Now Admin for iPhone, iPad and Mac (production and QA) and uploads them
# to TestFlight for internal testers only (wiki AUN-ADMIN-NATIVE, AD10). Never a GitHub release and never a workflow
# artifact: the repo is public and the Admin app is staff only. Without the Apple secrets the archives are built
# unsigned and discarded, so the pipeline is proven.
on:
  push:
    tags: ["admin-v*"]
  workflow_dispatch:
concurrency:
  group: admin-release-${{ github.ref }}
  cancel-in-progress: false
permissions: {contents: read}
env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      upload: ${{ steps.v.outputs.upload }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
            VERSION="${GITHUB_REF_NAME#admin-v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be admin-vX.Y.Z"; exit 1; }
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.$GITHUB_RUN_NUMBER"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -z "${ASC_KEY_P8:-}" ]]; then echo "::notice::No Apple secrets: unsigned build only, nothing uploaded."; fi

  build:
    needs: verify
    name: ${{ matrix.platform }} ${{ matrix.config }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, mac]
        config: [Release, QA]
    env:
      AUN_VERSION: ${{ needs.verify.outputs.version }}
      AUN_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen && xcodegen generate
      - uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift') }}
      # A dispatch from a branch never uploads, even with the secrets: TestFlight builds come from main tags only.
      - if: needs.verify.outputs.upload != 'true'
        run: echo "ASC_KEY_P8=" >> "$GITHUB_ENV"
      - run: scripts/admin-release.sh ${{ matrix.platform }} ${{ matrix.config }}
