name: CI
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
env:
  SWIFTLINT_VERSION: 0.65.1
  AUN_IOS_SIM_OS: "26.4.1"
jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint (pinned)
        run: |
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
      - run: SWIFTLINT=/tmp/swiftlint/swiftlint scripts/ci.sh lint
  fanous:
    name: fanous registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Vendored theme registry matches the pinned monorepo commit
        run: scripts/sync-fanous.sh --check
  test:
    name: ${{ matrix.job }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [ios, ipad, tvos, mac, studio, admin, admin-mac]
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift') }}
      - run: scripts/ci.sh ${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-${{ matrix.job }}
          path: build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
      - name: Snapshots recorded on this simulator, to review and commit
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshots-${{ matrix.job }}
          path: Packages/*/Tests/*/__Snapshots__
          retention-days: 7

  # Real sign-in through auth.qa with the seeded QA creator. Runs on main and by hand, never on fork PRs.
  live-qa:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      AUN_QA_EMAIL: qa-creator@delivered.resend.dev
      AUN_QA_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip without the QA secret
        id: gate
        run: if [ -n "$AUN_QA_PASSWORD" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        run: brew install xcodegen && xcodegen generate
      - if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift') }}
      - if: steps.gate.outputs.run == 'true'
        run: scripts/ci.sh live-qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-live-qa
          path: build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
