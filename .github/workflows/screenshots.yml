name: Store screenshots
# App Store screenshots from the UI tests on fixture data (scripts/screenshots.sh), en-US and ar-SA, kept as workflow
# artifacts in fastlane deliver's layout. Run it from Actions → Store screenshots → Run workflow.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        default: all
        options: [all, viewer-ios, viewer-tv, viewer-mac, studio-ios, studio-mac]
permissions: {contents: read}
env:
  # Xcode 27.1 (27A9275) on the xcode-27 runner image, the owner's local build. Its iOS 27.1 runtime only has the
  # iPhone Duo, so simulators run iOS/tvOS 27.0.
  XCODE_VERSION: "27.1"
  AUN_IOS_SIM_OS: "27.0"
  AUN_TVOS_SIM_OS: "27.0"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.p.outputs.apps }}
    steps:
      - id: p
        env:
          APP: ${{ inputs.app }}
        run: |
          if [[ "$APP" == all ]]; then
            echo 'apps=["viewer-ios","viewer-tv","viewer-mac","studio-ios","studio-mac"]' >> "$GITHUB_OUTPUT"
          else
            echo "apps=[\"$APP\"]" >> "$GITHUB_OUTPUT"
          fi
  shoot:
    needs: plan
    name: ${{ matrix.app }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - name: Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app" && xcodebuild -version && xcrun swift --version
      - run: brew install xcodegen && xcodegen generate
      - uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('Packages/*/Package.swift', 'AlUmmahNow.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: scripts/screenshots.sh ${{ matrix.app }} build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ matrix.app }}
          path: build/screenshots/${{ matrix.app }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-results-${{ matrix.app }}
          path: build/screenshot-results/*.xcresult
          retention-days: 7
